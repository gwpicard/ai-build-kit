[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-worker"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pypdf==5.3.0",
  "ocrmypdf==16.8.0",
  "pdfplumber==0.11.5",
  "pydantic==2.10.6",
  "psycopg[binary]==3.2.5",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pyright==1.1.394",
  "ruff==0.9.6",
  "pytest==8.3.4",
]
layout = ["docling==2.25.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
