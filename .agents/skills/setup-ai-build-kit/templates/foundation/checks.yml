name: checks
on:
  pull_request:
jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the trim left the tests alone
        run: sh .agents/hooks/check-trim.sh
      - name: Check sensitive-area map
        run: sh .agents/hooks/check-sensitive-areas.sh
      - name: Check changes against the pull request base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(sh .agents/hooks/check-sensitive-areas.sh --version) || exit 2
          if [ "$version" != "sensitive-area-check-v2" ]; then
            echo "Sensitive-area check: installed copy does not support change checks. Update the kit copy first."
            exit 2
          fi
          sh .agents/hooks/check-sensitive-areas.sh --change "$PR_BASE_SHA"
      - name: Install and test
        run: |
          echo "This check is still the placeholder the kit creates, so no tests have run and nothing has been verified."
          echo "Run the setup-ai-build-kit skill's stand-up step to replace it with the project's real install and test commands."
          echo "Red is the correct answer until then. A green tick here would mean nothing."
          exit 1
