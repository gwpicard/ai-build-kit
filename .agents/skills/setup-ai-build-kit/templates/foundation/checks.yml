name: checks
permissions:
  contents: read
  pull-requests: read
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: recipe
        name: Detect the selected recipe
        shell: bash
        run: |
          if grep -Eq '^Recipe: nextjs-supabase-on-(vercel|coolify)$' AGENTS.md; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check tests were not changed silently
        run: sh .agents/hooks/check-tests.sh
      - name: Check review findings
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: sh .agents/hooks/check-review.sh
      - name: Check sensitive-area map
        run: sh .agents/hooks/check-sensitive-areas.sh
      - name: Scan Git history for secrets
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          sh .agents/hooks/scan-secrets.sh "--range=$BASE_SHA..$HEAD_SHA"
      - name: Check changes against the pull request base
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(sh .agents/hooks/check-sensitive-areas.sh --version)
          [ "$version" = "sensitive-area-check-v3" ] || { echo "Sensitive-area check: installed copy does not support change checks. Update the kit copy first."; exit 2; }
          sh .agents/hooks/check-sensitive-areas.sh --change "$PR_BASE_SHA"
      - name: Locate the recipe project check
        if: steps.recipe.outputs.selected == 'true'
        run: test -f .github/workflows/check.yml
      - name: Install and test placeholder
        if: steps.recipe.outputs.selected != 'true'
        run: |
          echo "This check is still the placeholder the kit creates, so no tests have run and nothing has been verified."
          echo "Run the setup-ai-build-kit skill's stand-up step to replace it with the project's real install and test commands."
          echo "Red is the correct answer until then. A green tick here would mean nothing."
          exit 1
