name: Plain Postgres starter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-check:
    if: github.repository == 'gwpicard/ai-build-kit'
    defaults:
      run:
        working-directory: templates/nextjs-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: tool_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d tool_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Read the project files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
      - name: Install the locked packages
        run: npm ci
      - name: Prepare a disposable database
        run: |
          cp .env.example .env
          npm run db:bootstrap
          npm run db:migrate
          npm run db:migrate
      - name: Install the browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check the starter
        run: npm run check
      - name: Prove a removed policy fails its generated test
        run: npm run test:policy-fault
      - name: Prove excessive privileges fail their catalogue checks
        run: npm run test:privilege-fault
      - name: Check the restored policy and privileges
        run: npm test
