# Two jobs. source-kit-validation runs only in the kit's own repository, and
# tests the kit's own machinery: adapter generation and the invariants in
# .agents/tools/validate-kit.sh. project-check runs only in a clone, and
# starts as the honest placeholder below until /start's stand-up step
# replaces the install/test step with the project's real commands. Never
# delete source-kit-validation's logic in a clone; it stays skipped there by
# the if: condition, not by removal, so a clone that later forks or upstreams
# changes doesn't quietly lose the kit's own checks.
name: checks
on:
  pull_request:
jobs:
  source-kit-validation:
    if: github.repository == 'gwpicard/ai-build-kit-maintainer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate adapters and check for drift
        run: .agents/tools/build-adapters.sh --check
      - name: Validate the kit
        run: .agents/tools/validate-kit.sh

  project-check:
    if: github.repository != 'gwpicard/ai-build-kit-maintainer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install and test
        run: |
          echo "This check is still the placeholder the kit ships with, so no tests have run and nothing has been verified."
          echo "Run /start's stand-up step to replace it with the project's real install and test commands."
          echo "Red is the correct answer until then. A green tick here would mean nothing."
          exit 1
