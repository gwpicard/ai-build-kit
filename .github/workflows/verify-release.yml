name: verify release

# What was published is rebuilt from its own tag and compared with the archive
# that was reviewed before publication. It cannot un-publish anything, and it is
# not meant to: it turns a draft retargeted by hand, or a merge that landed
# between preparation and publication, into a red mark instead of a silent
# divergence.
#
# It writes nothing. There is one repository now, so a release is published
# where it was prepared and nothing has to be copied anywhere.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'gwpicard/ai-build-kit'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: current-main
      - name: Confirm the released tag belongs to main
        id: release-ref
        working-directory: current-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s\n' "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Only stable versions such as v0.1.0 are published."
            exit 1
          fi
          # Ask for the tag's commit instead of fetching the tag. The checkout
          # above keeps no credential, deliberately. This call carries the run's
          # own token, and main is already present in full, so the check below
          # stays local.
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq '.sha') || \
            tag_commit=""
          if [ -z "$tag_commit" ]; then
            echo "$VERSION has no commit on this repository yet; publish again once the tag exists."
            exit 1
          fi
          if ! git cat-file -e "$tag_commit^{commit}" 2>/dev/null; then
            echo "$VERSION points at work that is not in this repository's history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" HEAD; then
            echo "$VERSION does not point to reviewed main-branch work."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-ref.outputs.commit }}
          persist-credentials: false
          path: released-source
      - name: Validate the released source
        working-directory: released-source
        run: .agents/tools/validate-kit.sh
      - name: Assemble the starter
        working-directory: released-source
        run: .agents/tools/build-release.sh "$VERSION" "$RUNNER_TEMP/starter"
      - name: Compare with the reviewed starter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prepared-archive" "$RUNNER_TEMP/prepared-starter"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ai-build-kit-$VERSION.tar.gz" \
            --dir "$RUNNER_TEMP/prepared-archive"
          tar -xzf "$RUNNER_TEMP/prepared-archive/ai-build-kit-$VERSION.tar.gz" \
            -C "$RUNNER_TEMP/prepared-starter"
          diff -qr "$RUNNER_TEMP/starter" "$RUNNER_TEMP/prepared-starter"
