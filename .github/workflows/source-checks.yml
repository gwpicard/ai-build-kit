# This workflow checks the kit's own source. It is named apart from checks.yml
# on purpose: that name belongs to the project check a founded project receives
# from the setup skill's foundation template, and once the source and the
# released kit share one repository the two would otherwise want the same path.
name: source checks
on:
  pull_request:
permissions:
  contents: read

# A second push to the same pull request replaces the first. Without this,
# the run it replaced keeps going and is still billed.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-starter:
    if: github.repository == 'gwpicard/ai-build-kit'
    uses: ./.github/workflows/postgres-starter.yml
  source-kit-validation:
    needs: postgres-starter
    if: always() && github.repository == 'gwpicard/ai-build-kit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require the starter checks
        env:
          STARTER_RESULT: ${{ needs.postgres-starter.result }}
        run: test "$STARTER_RESULT" = success
      - name: Regenerate adapters and check for drift
        run: .agents/tools/build-adapters.sh --check
      - name: Validate the kit
        run: .agents/tools/validate-kit.sh
  # The site is built here exactly as the publish workflow builds it, on the
  # same system and Node version. A lockfile made on another system can leave
  # out a package this one needs, and the publish run is the first to notice.
  site-build:
    if: github.repository == 'gwpicard/ai-build-kit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Check the built pages
        run: .agents/tests/site-links.sh
  # The runner discovers every rehearsal and reports each result and duration.
  # Isolated tests share two workers; browser installers use separate groups.
  rehearsal:
    if: github.repository == 'gwpicard/ai-build-kit'
    runs-on: ubuntu-24.04
    # A rehearsal that waits for an answer nobody is there to give should stop
    # rather than hold the queue open.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare the starter's Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            .agents/skills/setup-hosting/recipes/parts/starters/nextjs-supabase/package-lock.json
      - name: Prepare the starter's database tools
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.289
      - name: Rehearse
        run: .agents/tests/run-all.sh
