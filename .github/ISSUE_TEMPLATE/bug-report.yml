name: Report a problem
description: Report a problem with AI Build Kit.
title: "[Problem] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, personal data, or private project details.
  - type: input
    id: version
    attributes:
      label: AI Build Kit version
      description: See the VERSION file in the installed maintain skill folder.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation route
      options:
        - Claude Code plugin
        - Shared skills installer
        - Manual release download
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent and version
      description: Include its version if known.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone reproduce it?
      description: Give steps to reproduce.
    validations:
      required: true
